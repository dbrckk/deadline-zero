name: Build Kenney Sci-Fi Runtime Kit

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'art_sources/third_party/kenney/space_kit/**'
      - 'tools/blender/promote_kenney_space_kit.py'
      - 'tools/assets/validate_generated_kenney_glb.py'
      - 'godot/assets/asset_manifest.json'
      - '.github/workflows/build-kenney-space-kit.yml'
  pull_request:
    paths:
      - 'art_sources/third_party/kenney/space_kit/**'
      - 'tools/blender/promote_kenney_space_kit.py'
      - 'tools/assets/validate_generated_kenney_glb.py'
      - 'godot/assets/asset_manifest.json'
      - '.github/workflows/build-kenney-space-kit.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Validate source/license contract
        run: python3 tools/assets/validate_asset_stack.py

      - name: Download pinned Blender 5.2.2 LTS
        run: |
          set -euo pipefail
          cd /tmp
          curl -fL --retry 4 https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz -o blender.tar.xz
          curl -fL --retry 4 https://download.blender.org/release/Blender5.2/blender-5.2.2.sha256 -o blender.sha256
          grep 'blender-5.2.2-linux-x64.tar.xz' blender.sha256 | sed 's#blender-5.2.2-linux-x64.tar.xz#blender.tar.xz#' | sha256sum -c -
          tar -xf blender.tar.xz
          test -x /tmp/blender-5.2.2-linux-x64/blender

      - name: Promote curated Kenney source geometry
        run: |
          set -euo pipefail
          rm -rf build/kenney-space-kit
          /tmp/blender-5.2.2-linux-x64/blender -b --factory-startup \
            -P tools/blender/promote_kenney_space_kit.py -- \
            --source art_sources/third_party/kenney/space_kit \
            --output build/kenney-space-kit

      - name: Validate runtime GLB budgets
        run: |
          set -euo pipefail
          python3 tools/assets/validate_generated_kenney_glb.py build/kenney-space-kit
          (cd build/kenney-space-kit && sha256sum *.glb > SHA256SUMS.txt)
          (cd build/kenney-space-kit && sha256sum -c SHA256SUMS.txt)

      - name: Promote validated runtime kit into Godot
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          rm -rf godot/assets/generated/kenney_space_kit
          mkdir -p godot/assets/generated/kenney_space_kit
          cp build/kenney-space-kit/*.glb godot/assets/generated/kenney_space_kit/
          cp build/kenney-space-kit/SHA256SUMS.txt godot/assets/generated/kenney_space_kit/
          cp art_sources/third_party/kenney/space_kit/LICENSE.txt godot/assets/generated/kenney_space_kit/LICENSE.txt
          cat > godot/assets/generated/kenney_space_kit/SOURCE.md <<'EOF'
          # Deadline: Zero Kenney-derived runtime kit

          Source geometry: Kenney Space Kit, CC0 1.0.
          Curated source bytes and provenance live under:
          art_sources/third_party/kenney/space_kit/

          Runtime GLBs are generated by:
          tools/blender/promote_kenney_space_kit.py

          Pinned authoring runtime: Blender 5.2.2 LTS.
          GLB triangle/material/image/file-size budgets are enforced before promotion.
          EOF
          git config user.name "deadline-zero-assets"
          git config user.email "actions@users.noreply.github.com"
          git add godot/assets/generated/kenney_space_kit
          if git diff --cached --quiet; then
            echo "Kenney runtime kit already promoted."
            exit 0
          fi
          git commit -m "assets(godot): promote Kenney CC0 runtime GLBs [skip render]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload runtime kit for review
        uses: actions/upload-artifact@v4
        with:
          name: deadline-zero-kenney-runtime-kit-${{ github.sha }}
          path: |
            build/kenney-space-kit/*.glb
            build/kenney-space-kit/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
