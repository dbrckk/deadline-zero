name: Ultimate Monsters Catalog

on:
  pull_request:
    paths:
      - '.github/workflows/ultimate-monsters-catalog.yml'
      - 'config/active-actor-candidate.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download official Quaternius Ultimate Monsters folder
        run: |
          python -m pip install --disable-pip-version-check gdown
          mkdir -p build/ultimate-monsters
          cd build/ultimate-monsters
          gdown --folder 'https://drive.google.com/drive/folders/18m4KpzpEzhC9wl7jzr6dUc0N8Jozr79C?usp=sharing'

      - name: Build deterministic source catalog
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          root = Path('build/ultimate-monsters')
          rows = []
          for p in sorted(root.rglob('*')):
              if not p.is_file():
                  continue
              h = hashlib.sha256()
              with p.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              rows.append({
                  'path': p.relative_to(root).as_posix(),
                  'size_bytes': p.stat().st_size,
                  'sha256': h.hexdigest(),
                  'suffix': p.suffix.lower(),
              })

          blend = [r for r in rows if r['suffix'] == '.blend']
          fbx = [r for r in rows if r['suffix'] == '.fbx']
          gltf = [r for r in rows if r['suffix'] in ('.gltf', '.glb')]
          report = {
              'provider': 'Quaternius',
              'pack': 'Ultimate Monsters',
              'license': 'CC0 1.0',
              'official_drive_folder_id': '18m4KpzpEzhC9wl7jzr6dUc0N8Jozr79C',
              'file_count': len(rows),
              'blend_count': len(blend),
              'fbx_count': len(fbx),
              'gltf_count': len(gltf),
              'files': rows,
          }
          Path('build/ultimate-monsters-catalog.json').write_text(
              json.dumps(report, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps({k: report[k] for k in ('file_count','blend_count','fbx_count','gltf_count')}, indent=2))
          print('--- likely BRUTE candidates ---')
          for r in rows:
              low = r['path'].lower()
              if any(token in low for token in ('orc', 'yeti', 'demon', 'golem', 'goleling', 'king')) and r['suffix'] in ('.blend','.fbx','.gltf','.glb'):
                  print(r['path'], r['size_bytes'], r['sha256'])
          PY

      - name: Upload official source catalog
        uses: actions/upload-artifact@v4
        with:
          name: ultimate-monsters-catalog-${{ github.run_number }}
          path: build/ultimate-monsters-catalog.json
          retention-days: 14
