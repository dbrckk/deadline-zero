name: Mobile Presentation QA

on:
  push:
    branches:
      - aaa-zombie-wave-rebuild
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-presentation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture 1536x691 combat presentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            set -eu
            adb wait-for-device
            timeout 300s bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 2; done'
            gradle :android:installDebug :android:installDebugAndroidTest
            timeout 3m adb shell am instrument -w -e class com.deadlinezero.game.android.AndroidMobilePresentationProbeTest#capturesCombatAt1536x691 com.deadlinezero.game.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/mobile-presentation.txt
            grep -q 'OK (1 test)' /tmp/mobile-presentation.txt
            mkdir -p build/mobile-presentation
            adb shell ls -l /sdcard/Android/data/com.deadlinezero.game/files/qa/mobile-1536x691.png
            adb pull /sdcard/Android/data/com.deadlinezero.game/files/qa/mobile-1536x691.png build/mobile-presentation/mobile-1536x691.png
            test -s build/mobile-presentation/mobile-1536x691.png
            python3 - <<'PY'
            import struct
            from pathlib import Path
            path = Path('build/mobile-presentation/mobile-1536x691.png')
            data = path.read_bytes()
            assert data[:8] == b'\x89PNG\r\n\x1a\n'
            width, height = struct.unpack('>II', data[16:24])
            assert (width, height) == (1536, 691), (width, height)
            print('MOBILE_PRESENTATION', width, height, path.stat().st_size)
            PY
      - name: Upload 1536x691 visual QA
        uses: actions/upload-artifact@v4
        with:
          name: mobile-presentation-1536x691-${{ github.sha }}
          path: build/mobile-presentation/mobile-1536x691.png
          if-no-files-found: error
          retention-days: 14
