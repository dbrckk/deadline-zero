name: Mobile Presentation QA

on:
  push:
    branches:
      - aaa-zombie-wave-rebuild
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-presentation:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture standard and 1536x691 combat regression states
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            set -eu
            adb wait-for-device
            timeout 300s bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 2; done'
            gradle :android:installDebug :android:installDebugAndroidTest
            mkdir -p build/mobile-presentation/standard build/mobile-presentation/wide-1536x691
            timeout 4m adb shell am instrument -w -e class com.deadlinezero.game.android.AndroidCombatVisualRegressionTest#capturesRequiredCombatRegressionStates com.deadlinezero.game.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/combat-visual-standard.txt
            grep -q 'OK (1 test)' /tmp/combat-visual-standard.txt
            for f in combat-early-wave.png combat-dense-horde.png combat-ranged-pressure.png combat-champion-crowd.png combat-boss-phase.png combat-low-hp.png combat-pickup-upgrade.png; do adb shell ls -l /sdcard/Android/data/com.deadlinezero.game/files/qa/$f; adb pull /sdcard/Android/data/com.deadlinezero.game/files/qa/$f build/mobile-presentation/standard/$f; test -s build/mobile-presentation/standard/$f; done
            python3 -c "import struct; from pathlib import Path; files=sorted(Path('build/mobile-presentation/standard').glob('combat-*.png')); assert len(files) == 7, files; dims=[struct.unpack('>II', p.read_bytes()[16:24]) for p in files]; assert all(w > h and w / float(h) > 1.5 for w,h in dims), dims; print('COMBAT_STANDARD', dims)"
            timeout 3m adb shell am instrument -w -e class com.deadlinezero.game.android.AndroidMobilePresentationProbeTest#capturesCombatAt1536x691 com.deadlinezero.game.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/mobile-presentation.txt
            grep -q 'OK (1 test)' /tmp/mobile-presentation.txt
            adb shell ls -l /sdcard/Android/data/com.deadlinezero.game/files/qa/mobile-1536x691.png
            adb pull /sdcard/Android/data/com.deadlinezero.game/files/qa/mobile-1536x691.png build/mobile-presentation/mobile-1536x691.png
            test -s build/mobile-presentation/mobile-1536x691.png
            python3 -c "import struct; from pathlib import Path; p=Path('build/mobile-presentation/mobile-1536x691.png'); d=p.read_bytes(); assert d[:8] == b'\x89PNG\r\n\x1a\n'; w,h=struct.unpack('>II', d[16:24]); assert (w,h) == (1536,691), (w,h); print('MOBILE_PRESENTATION', w, h, p.stat().st_size)"
            adb shell wm size 1536x691
            timeout 4m adb shell am instrument -w -e deadlinezero.wideProbe true -e class com.deadlinezero.game.android.AndroidCombatVisualRegressionTest#capturesRequiredCombatRegressionStates com.deadlinezero.game.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/combat-visual-wide.txt
            grep -q 'OK (1 test)' /tmp/combat-visual-wide.txt
            for f in combat-early-wave.png combat-dense-horde.png combat-ranged-pressure.png combat-champion-crowd.png combat-boss-phase.png combat-low-hp.png combat-pickup-upgrade.png; do adb shell ls -l /sdcard/Android/data/com.deadlinezero.game/files/qa/$f; adb pull /sdcard/Android/data/com.deadlinezero.game/files/qa/$f build/mobile-presentation/wide-1536x691/$f; test -s build/mobile-presentation/wide-1536x691/$f; done
            python3 -c "import struct; from pathlib import Path; files=sorted(Path('build/mobile-presentation/wide-1536x691').glob('combat-*.png')); assert len(files) == 7, files; dims=[struct.unpack('>II', p.read_bytes()[16:24]) for p in files]; assert all((w,h) == (1536,691) for w,h in dims), dims; print('COMBAT_WIDE', dims)"
            adb shell wm size reset
      - name: Upload combat visual regression QA
        uses: actions/upload-artifact@v4
        with:
          name: combat-visual-regression-${{ github.sha }}
          path: build/mobile-presentation/
          if-no-files-found: error
          retention-days: 14
