name: Rex Auto-Rig

on:
  workflow_dispatch:
    inputs:
      source_path:
        description: "Path to Rex GLB in repository"
        required: false
        default: "art_sources/rex/master/rex_source.glb"
      source_url:
        description: "Optional HTTPS URL used when source_path is absent"
        required: false
        default: ""
      method:
        description: "Motius rigging backend"
        required: false
        default: "make-it-animatable"
        type: choice
        options:
          - make-it-animatable
          - template
  push:
    paths:
      - "art_sources/rex/master/rex_source.glb"
      - "art_sources/rex/master/source-url.txt"

permissions:
  contents: read

jobs:
  rig:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_PATH: ${{ github.event.inputs.source_path || 'art_sources/rex/master/rex_source.glb' }}
      SOURCE_URL_INPUT: ${{ github.event.inputs.source_url || '' }}
      RIG_METHOD: ${{ github.event.inputs.method || 'make-it-animatable' }}
      EXPECTED_SHA256: 43c2bffdcbcbacd59327bef34b2a71ef2afbebbe5d032ecfadedbd109f717d17

    steps:
      - name: Checkout Deadline Zero
        uses: actions/checkout@v4

      - name: Resolve Rex source
        shell: bash
        run: |
          set -euo pipefail
          resolved="$SOURCE_PATH"

          if [ ! -s "$resolved" ]; then
            url="$SOURCE_URL_INPUT"
            if [ -z "$url" ] && [ -s art_sources/rex/master/source-url.txt ]; then
              url="$(tr -d '\r\n' < art_sources/rex/master/source-url.txt)"
            fi
            if [ -z "$url" ]; then
              echo "::error::No Rex GLB found and no source URL configured"
              exit 2
            fi
            case "$url" in
              https://*) ;;
              *) echo "::error::Rex source URL must use HTTPS"; exit 2 ;;
            esac
            mkdir -p build/rex-source
            resolved="build/rex-source/rex_source.glb"
            curl --fail --location --retry 3 --retry-delay 2 --max-time 180 \
              --output "$resolved" "$url"
          fi

          test -s "$resolved"
          actual="$(sha256sum "$resolved" | awk '{print $1}')"
          if [ "$actual" != "$EXPECTED_SHA256" ]; then
            echo "::error::Rex source SHA-256 mismatch: $actual"
            exit 3
          fi
          echo "REX_SOURCE=$resolved" >> "$GITHUB_ENV"
          sha256sum "$resolved" | tee rex-source.sha256
          file "$resolved"

      - name: Install Blender
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y blender libgl1 libegl1
          blender --version | head -n 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Motius Auto-Rig
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/ZeyuLing/Motius.git .motius
          python -m pip install --upgrade pip
          python -m pip install -e ".motius[auto-rig]"

      - name: Auto-rig Rex
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/rex-autorig
          OUT="build/rex-autorig/rex_rigged.glb"

          run_rig() {
            python .motius/tools/auto_rig_character.py \
              "$REX_SOURCE" "$OUT" \
              --method "$1" \
              --blender "$(command -v blender)"
          }

          if ! run_rig "$RIG_METHOD"; then
            if [ "$RIG_METHOD" = "make-it-animatable" ]; then
              echo "::warning::Make-It-Animatable backend failed; trying template fallback"
              run_rig template
            else
              exit 1
            fi
          fi

          test -s "$OUT"
          sha256sum "$OUT" | tee build/rex-autorig/rex-rigged.sha256

      - name: Validate rig and render previews
        shell: bash
        run: |
          set -euo pipefail
          blender -b --python tools/blender/validate_rig.py -- \
            --input build/rex-autorig/rex_rigged.glb \
            --output build/rex-autorig/validation

      - name: Add report to job summary
        if: always()
        shell: bash
        run: |
          if [ -f build/rex-autorig/validation/rig-report.json ]; then
            echo '## Rex auto-rig report' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat build/rex-autorig/validation/rig-report.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload rig artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rex-auto-rig-${{ github.run_number }}
          path: |
            rex-source.sha256
            build/rex-autorig/
          if-no-files-found: warn
          retention-days: 30
