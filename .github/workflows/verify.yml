name: Verify
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Validate final sprite production layout
        run: |
          python3 -m py_compile tools/validate_final_sprite_layout.py tools/validate_rex_reference.py tools/slice_sprite_sheet.py tools/build_final_sprite_frames.py tools/verify_final_atlas.py tools/test_verify_final_atlas.py tools/sprites/assemble_actor_sheet.py tools/sprites/audit_final_art_status.py tools/sprites/validate_final_art_promotion_consistency.py tools/sprites/validate_actor_production_contracts.py tools/sprites/resolve_actor_actions.py tools/sprites/test_resolve_actor_actions.py tools/sprites/validate_actor_role_metrics.py tools/sprites/test_validate_actor_role_metrics.py tools/sprites/test_validate_actor_production_contracts.py tools/android/scan_runtime_log.py tools/android/test_scan_runtime_log.py tools/environment/validate_environment_art_contract.py tools/environment/test_validate_environment_art_contract.py tools/environment/pack_environment_art.py tools/environment/upsert_environment_atlas.py tools/environment/test_upsert_environment_atlas.py
          python3 tools/validate_final_sprite_layout.py
          python3 tools/validate_rex_reference.py
          mkdir -p build
          python3 tools/sprites/audit_final_art_status.py --json > build/final-art-status.json
          python3 tools/sprites/validate_final_art_promotion_consistency.py
          python3 tools/sprites/validate_actor_production_contracts.py
          python3 -m unittest discover -s tools -p 'test_verify_final_atlas.py'
          python3 -m unittest discover -s tools/sprites -p 'test_resolve_actor_actions.py'
          python3 -m unittest discover -s tools/sprites -p 'test_validate_actor_role_metrics.py'
          python3 -m unittest discover -s tools/sprites -p 'test_validate_actor_production_contracts.py'
          python3 -m unittest discover -s tools/perf -p 'test_compare_android_benchmark.py'
          python3 -m unittest discover -s tools/android -p 'test_scan_runtime_log.py'
          PYTHONPATH=tools/environment python3 -m unittest discover -s tools/environment -p 'test_validate_environment_art_contract.py'
          PYTHONPATH=tools/environment python3 -m unittest discover -s tools/environment -p 'test_upsert_environment_atlas.py'
          python3 tools/environment/validate_environment_art_contract.py
      - name: Compile and test core
        run: gradle :core:compileJava :core:test :desktop:compileJava
      - name: Smoke-test desktop runtime
        run: xvfb-run -a gradle :desktop:smokeRun

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Verify Android production build
        run: gradle :android:lintDebug :android:lintRelease :android:assembleDebug :android:bundleRelease -PallowTestAds=true -PallowPlaceholderAssets=true
      - name: Stage first-playable APK
        run: |
          mkdir -p build/first-playable
          cp android/build/outputs/apk/debug/android-debug.apk build/first-playable/deadline-zero-first-playable.apk
          (cd build/first-playable && sha256sum deadline-zero-first-playable.apk > SHA256SUMS.txt)
          (cd build/first-playable && sha256sum -c SHA256SUMS.txt)
      - name: Upload first-playable APK
        uses: actions/upload-artifact@v4
        with:
          name: deadline-zero-first-playable-${{ github.sha }}
          path: build/first-playable/
          if-no-files-found: error
          retention-days: 14

  android-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke-test Android runtime and capture gameplay
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            set -eu
            adb wait-for-device
            timeout 300s bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 2; done'
            adb shell input keyevent 82 || true
            timeout 12m gradle :android:connectedDebugAndroidTest
            gradle :android:installDebug :android:installDebugAndroidTest
            adb shell pm path com.deadlinezero.game | grep -q 'package:'
            adb shell cmd package resolve-activity --brief -a android.intent.action.MAIN -c android.intent.category.LAUNCHER com.deadlinezero.game | grep -q 'AndroidLauncher'
            adb shell settings put secure immersive_mode_confirmations confirmed || true
            mkdir -p build/android-runtime
            adb logcat -c
            trap 'adb logcat -d -v threadtime > build/android-runtime/logcat.txt 2>/dev/null || true' EXIT
            timeout 3m adb shell am instrument -w -e class com.deadlinezero.game.android.AndroidFirstPlayableJourneyTest#traversesContractCombatDefeatAndVictorySettlement com.deadlinezero.game.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/first-playable-journey.txt
            grep -q 'OK (1 test)' /tmp/first-playable-journey.txt
            timeout 3m adb shell am instrument -w -e class com.deadlinezero.game.android.AndroidPerformanceProbeTest#recordsLoadedGameplayPerformanceTelemetry com.deadlinezero.game.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/android-performance-probe.txt
            grep -q 'OK (1 test)' /tmp/android-performance-probe.txt
            mkdir -p build/android-performance
            adb shell ls -l /sdcard/Android/data/com.deadlinezero.game/files/qa/performance-probe.json
            adb pull /sdcard/Android/data/com.deadlinezero.game/files/qa/performance-probe.json build/android-performance/performance-probe.json
            test -s build/android-performance/performance-probe.json
            python3 -c 'import json; from pathlib import Path; p=Path("build/android-performance/performance-probe.json"); data=json.loads(p.read_text()); required={"scenario","targetFps","averageFps","p95FrameMs","p99FrameMs","jankRatio","stable","thermalLevel","effectiveFxQuality","activeEnemies","activeProjectiles","activeSpatialBuckets","retainedSpatialBuckets"}; assert required <= data.keys(), data; assert data["scenario"] == "loaded-40-enemy-ring", data; assert data["targetFps"] in (60,90,120), data; assert data["averageFps"] > 5, data; assert 0 < data["p95FrameMs"] <= 250, data; assert data["p99FrameMs"] >= data["p95FrameMs"], data; assert 0 <= data["jankRatio"] <= 1, data; assert data["thermalLevel"] in {"UNKNOWN","NORMAL","LIGHT","MODERATE","SEVERE","CRITICAL"}, data; assert 0.40 <= data["effectiveFxQuality"] <= 1.0, data; assert data["activeEnemies"] >= 40, data; assert data["activeProjectiles"] >= 0, data; assert data["activeSpatialBuckets"] > 0, data; assert data["retainedSpatialBuckets"] >= data["activeSpatialBuckets"], data; print("PERF_PROBE", json.dumps(data, sort_keys=True))'
            timeout 3m adb shell am instrument -w -e class com.deadlinezero.game.android.AndroidPerformanceProbeTest#recordsHordeProjectileStressTelemetry com.deadlinezero.game.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/android-performance-stress.txt
            grep -q 'OK (1 test)' /tmp/android-performance-stress.txt
            adb shell ls -l /sdcard/Android/data/com.deadlinezero.game/files/qa/performance-stress.json
            adb pull /sdcard/Android/data/com.deadlinezero.game/files/qa/performance-stress.json build/android-performance/performance-stress.json
            test -s build/android-performance/performance-stress.json
            python3 -c 'import json; from pathlib import Path; p=Path("build/android-performance/performance-stress.json"); data=json.loads(p.read_text()); required={"scenario","targetFps","averageFps","p95FrameMs","p99FrameMs","jankRatio","stable","thermalLevel","effectiveFxQuality","activeEnemies","activeProjectiles","activeSpatialBuckets","retainedSpatialBuckets"}; assert required <= data.keys(), data; assert data["scenario"] == "horde-160-projectile-180", data; assert data["targetFps"] in (60,90,120), data; assert data["averageFps"] > 5, data; assert 0 < data["p95FrameMs"] <= 250, data; assert data["p99FrameMs"] >= data["p95FrameMs"], data; assert 0 <= data["jankRatio"] <= 1, data; assert data["activeEnemies"] >= 140, data; assert data["activeProjectiles"] >= 140, data; assert data["activeSpatialBuckets"] > 0, data; print("PERF_STRESS", json.dumps(data, sort_keys=True))'
            timeout 8m adb shell am instrument -w -e class com.deadlinezero.game.android.AndroidGameplayVisualProbeTest#capturesForgeHoundGameplayAndAttackFrames,com.deadlinezero.game.android.AndroidGameplayVisualProbeTest#capturesCinderGunnerGameplayAndAttackFrames,com.deadlinezero.game.android.AndroidGameplayVisualProbeTest#capturesSlagGuardGameplayAndAttackFrames,com.deadlinezero.game.android.AndroidGameplayVisualProbeTest#capturesPhaseStalkerGameplayAndAttackFrames,com.deadlinezero.game.android.AndroidGameplayVisualProbeTest#capturesStaticSeerGameplayAndAttackFrames,com.deadlinezero.game.android.AndroidGameplayVisualProbeTest#capturesNullWardGameplayAndAttackFrames,com.deadlinezero.game.android.AndroidGameplayVisualProbeTest#capturesWeeklyMissionsScreen,com.deadlinezero.game.android.AndroidGameplayVisualProbeTest#capturesCloudSaveScreen,com.deadlinezero.game.android.AndroidGameplayVisualProbeTest#capturesGraphicsQualitySettings,com.deadlinezero.game.android.AndroidGameplayVisualProbeTest#capturesCryoVaultGameplay,com.deadlinezero.game.android.AndroidGameplayVisualProbeTest#capturesCryogenicDepthsGameplay,com.deadlinezero.game.android.AndroidGameplayVisualProbeTest#capturesExpandedUpgradePoolOverlay,com.deadlinezero.game.android.AndroidGameplayVisualProbeTest#capturesFrostColossusGameplay,com.deadlinezero.game.android.AndroidGameplayVisualProbeTest#capturesChampionVariantCrowd com.deadlinezero.game.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/production-roster-visual-probe.txt
            grep -q 'OK (14 tests)' /tmp/production-roster-visual-probe.txt
            mkdir -p build/android-visual-qa
            adb shell ls -l /sdcard/Android/data/com.deadlinezero.game/files/qa/forge-hound-gameplay.png
            adb pull /sdcard/Android/data/com.deadlinezero.game/files/qa/forge-hound-gameplay.png build/android-visual-qa/forge-hound-gameplay.png
            test -s build/android-visual-qa/forge-hound-gameplay.png
            adb shell ls -l /sdcard/Android/data/com.deadlinezero.game/files/qa/forge-hound-crowd.png
            adb pull /sdcard/Android/data/com.deadlinezero.game/files/qa/forge-hound-crowd.png build/android-visual-qa/forge-hound-crowd.png
            test -s build/android-visual-qa/forge-hound-crowd.png
            adb shell ls -l /sdcard/Android/data/com.deadlinezero.game/files/qa/forge-hound-attack.png
            adb pull /sdcard/Android/data/com.deadlinezero.game/files/qa/forge-hound-attack.png build/android-visual-qa/forge-hound-attack.png
            test -s build/android-visual-qa/forge-hound-attack.png
            adb shell ls -l /sdcard/Android/data/com.deadlinezero.game/files/qa/cinder-gunner-gameplay.png
            adb pull /sdcard/Android/data/com.deadlinezero.game/files/qa/cinder-gunner-gameplay.png build/android-visual-qa/cinder-gunner-gameplay.png
            test -s build/android-visual-qa/cinder-gunner-gameplay.png
            adb shell ls -l /sdcard/Android/data/com.deadlinezero.game/files/qa/cinder-gunner-crowd.png
            adb pull /sdcard/Android/data/com.deadlinezero.game/files/qa/cinder-gunner-crowd.png build/android-visual-qa/cinder-gunner-crowd.png
            test -s build/android-visual-qa/cinder-gunner-crowd.png
            adb shell ls -l /sdcard/Android/data/com.deadlinezero.game/files/qa/cinder-gunner-attack.png
            adb pull /sdcard/Android/data/com.deadlinezero.game/files/qa/cinder-gunner-attack.png build/android-visual-qa/cinder-gunner-attack.png
            test -s build/android-visual-qa/cinder-gunner-attack.png
            adb shell ls -l /sdcard/Android/data/com.deadlinezero.game/files/qa/slag-guard-gameplay.png
            adb pull /sdcard/Android/data/com.deadlinezero.game/files/qa/slag-guard-gameplay.png build/android-visual-qa/slag-guard-gameplay.png
            test -s build/android-visual-qa/slag-guard-gameplay.png
            adb shell ls -l /sdcard/Android/data/com.deadlinezero.game/files/qa/slag-guard-crowd.png
            adb pull /sdcard/Android/data/com.deadlinezero.game/files/qa/slag-guard-crowd.png build/android-visual-qa/slag-guard-crowd.png
            test -s build/android-visual-qa/slag-guard-crowd.png
            adb shell ls -l /sdcard/Android/data/com.deadlinezero.game/files/qa/slag-guard-attack.png
            adb pull /sdcard/Android/data/com.deadlinezero.game/files/qa/slag-guard-attack.png build/android-visual-qa/slag-guard-attack.png
            test -s build/android-visual-qa/slag-guard-attack.png
            adb shell ls -l /sdcard/Android/data/com.deadlinezero.game/files/qa/phase-stalker-gameplay.png
            adb pull /sdcard/Android/data/com.deadlinezero.game/files/qa/phase-stalker-gameplay.png build/android-visual-qa/phase-stalker-gameplay.png
            test -s build/android-visual-qa/phase-stalker-gameplay.png
            adb shell ls -l /sdcard/Android/data/com.deadlinezero.game/files/qa/phase-stalker-crowd.png
            adb pull /sdcard/Android/data/com.deadlinezero.game/files/qa/phase-stalker-crowd.png build/android-visual-qa/phase-stalker-crowd.png
            test -s build/android-visual-qa/phase-stalker-crowd.png
            adb shell ls -l /sdcard/Android/data/com.deadlinezero.game/files/qa/phase-stalker-attack.png
            adb pull /sdcard/Android/data/com.deadlinezero.game/files/qa/phase-stalker-attack.png build/android-visual-qa/phase-stalker-attack.png
            test -s build/android-visual-qa/phase-stalker-attack.png
            adb shell ls -l /sdcard/Android/data/com.deadlinezero.game/files/qa/static-seer-gameplay.png
            adb pull /sdcard/Android/data/com.deadlinezero.game/files/qa/static-seer-gameplay.png build/android-visual-qa/static-seer-gameplay.png
            test -s build/android-visual-qa/static-seer-gameplay.png
            adb shell ls -l /sdcard/Android/data/com.deadlinezero.game/files/qa/static-seer-crowd.png
            adb pull /sdcard/Android/data/com.deadlinezero.game/files/qa/static-seer-crowd.png build/android-visual-qa/static-seer-crowd.png
            test -s build/android-visual-qa/static-seer-crowd.png
            adb shell ls -l /sdcard/Android/data/com.deadlinezero.game/files/qa/static-seer-attack.png
            adb pull /sdcard/Android/data/com.deadlinezero.game/files/qa/static-seer-attack.png build/android-visual-qa/static-seer-attack.png
            test -s build/android-visual-qa/static-seer-attack.png
            adb shell ls -l /sdcard/Android/data/com.deadlinezero.game/files/qa/null-ward-gameplay.png
            adb pull /sdcard/Android/data/com.deadlinezero.game/files/qa/null-ward-gameplay.png build/android-visual-qa/null-ward-gameplay.png
            test -s build/android-visual-qa/null-ward-gameplay.png
            adb shell ls -l /sdcard/Android/data/com.deadlinezero.game/files/qa/null-ward-crowd.png
            adb pull /sdcard/Android/data/com.deadlinezero.game/files/qa/null-ward-crowd.png build/android-visual-qa/null-ward-crowd.png
            test -s build/android-visual-qa/null-ward-crowd.png
            adb shell ls -l /sdcard/Android/data/com.deadlinezero.game/files/qa/null-ward-attack.png
            adb pull /sdcard/Android/data/com.deadlinezero.game/files/qa/null-ward-attack.png build/android-visual-qa/null-ward-attack.png
            test -s build/android-visual-qa/null-ward-attack.png
            adb shell ls -l /sdcard/Android/data/com.deadlinezero.game/files/qa/weekly-missions.png
            adb pull /sdcard/Android/data/com.deadlinezero.game/files/qa/weekly-missions.png build/android-visual-qa/weekly-missions.png
            test -s build/android-visual-qa/weekly-missions.png
            adb shell ls -l /sdcard/Android/data/com.deadlinezero.game/files/qa/cloud-save.png
            adb pull /sdcard/Android/data/com.deadlinezero.game/files/qa/cloud-save.png build/android-visual-qa/cloud-save.png
            test -s build/android-visual-qa/cloud-save.png
            adb shell ls -l /sdcard/Android/data/com.deadlinezero.game/files/qa/graphics-settings.png
            adb pull /sdcard/Android/data/com.deadlinezero.game/files/qa/graphics-settings.png build/android-visual-qa/graphics-settings.png
            test -s build/android-visual-qa/graphics-settings.png
            adb shell ls -l /sdcard/Android/data/com.deadlinezero.game/files/qa/cryo-vault-gameplay.png
            adb pull /sdcard/Android/data/com.deadlinezero.game/files/qa/cryo-vault-gameplay.png build/android-visual-qa/cryo-vault-gameplay.png
            test -s build/android-visual-qa/cryo-vault-gameplay.png
            adb shell ls -l /sdcard/Android/data/com.deadlinezero.game/files/qa/cryogenic-depths-gameplay.png
            adb pull /sdcard/Android/data/com.deadlinezero.game/files/qa/cryogenic-depths-gameplay.png build/android-visual-qa/cryogenic-depths-gameplay.png
            test -s build/android-visual-qa/cryogenic-depths-gameplay.png
            adb shell ls -l /sdcard/Android/data/com.deadlinezero.game/files/qa/upgrade-pool.png
            adb pull /sdcard/Android/data/com.deadlinezero.game/files/qa/upgrade-pool.png build/android-visual-qa/upgrade-pool.png
            test -s build/android-visual-qa/upgrade-pool.png
            adb shell ls -l /sdcard/Android/data/com.deadlinezero.game/files/qa/frost-colossus-gameplay.png
            adb pull /sdcard/Android/data/com.deadlinezero.game/files/qa/frost-colossus-gameplay.png build/android-visual-qa/frost-colossus-gameplay.png
            test -s build/android-visual-qa/frost-colossus-gameplay.png
            adb shell ls -l /sdcard/Android/data/com.deadlinezero.game/files/qa/champion-variants.png
            adb pull /sdcard/Android/data/com.deadlinezero.game/files/qa/champion-variants.png build/android-visual-qa/champion-variants.png
            test -s build/android-visual-qa/champion-variants.png
            adb shell am force-stop com.deadlinezero.game
            test -z "$(adb shell pidof com.deadlinezero.game)"
            adb shell monkey -p com.deadlinezero.game -c android.intent.category.LAUNCHER 1
            sleep 2
            adb shell pidof com.deadlinezero.game | grep -q .
            adb shell am instrument -w -e persistencePhase seed -e class com.deadlinezero.game.android.AndroidProcessPersistenceTest#seedProfileBeforeExternalProcessDeath com.deadlinezero.game.test/androidx.test.runner.AndroidJUnitRunner | grep -q 'OK (1 test)'
            adb shell am force-stop com.deadlinezero.game
            test -z "$(adb shell pidof com.deadlinezero.game)"
            adb shell am instrument -w -e persistencePhase verify -e class com.deadlinezero.game.android.AndroidProcessPersistenceTest#verifyProfileAfterExternalProcessRestart com.deadlinezero.game.test/androidx.test.runner.AndroidJUnitRunner | grep -q 'OK (1 test)'
            adb logcat -d -v threadtime > build/android-runtime/logcat.txt
            test -s build/android-runtime/logcat.txt
            trap - EXIT
      - name: Gate Android runtime crashes and ANRs
        if: always()
        run: |
          set -euo pipefail
          test -s build/android-runtime/logcat.txt
          python3 tools/android/scan_runtime_log.py             build/android-runtime/logcat.txt             --package com.deadlinezero.game             --json-out build/android-runtime/crash-anr-report.json

      - name: Upload Android runtime diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-runtime-diagnostics-${{ github.run_number }}
          path: |
            build/android-runtime/logcat.txt
            build/android-runtime/crash-anr-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Android gameplay visual QA
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-gameplay-visual-qa-${{ github.run_number }}
          path: build/android-visual-qa/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Android performance benchmark
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-performance-${{ github.run_number }}
          path: |
            build/android-performance/performance-probe.json
            build/android-performance/performance-stress.json
          if-no-files-found: warn
          retention-days: 30

      - name: Compare Android performance with main baseline
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE_DIR="build/android-performance-baseline"
          mkdir -p "$BASE_DIR"
          test -s build/android-performance/performance-probe.json
          test -s build/android-performance/performance-stress.json

          baseline_root=""
          baseline_run=""
          for run_id in $(gh run list --repo "$GITHUB_REPOSITORY" --branch main --workflow Verify --status success --limit 20 --json databaseId --jq '.[].databaseId'); do
            rm -rf "$BASE_DIR"/*
            if ! gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --pattern 'android-performance-*' --dir "$BASE_DIR" >/tmp/perf-baseline-download.log 2>&1; then
              continue
            fi
            probe=$(find "$BASE_DIR" -type f -name performance-probe.json | head -n 1 || true)
            stress=$(find "$BASE_DIR" -type f -name performance-stress.json | head -n 1 || true)
            if [ -n "$probe" ] && [ -n "$stress" ]; then
              baseline_root=$(dirname "$probe")
              if [ -s "$baseline_root/performance-stress.json" ]; then
                baseline_run="$run_id"
                break
              fi
            fi
          done

          if [ -z "$baseline_root" ]; then
            echo "PERF_BASELINE skipped: no successful main artifact contains both benchmark scenarios"
            printf '{"comparable":false,"reason":"no complete successful main benchmark artifact found","regressions":[],"metrics":{}}\n' > build/android-performance/probe-regression-report.json
            printf '{"comparable":false,"reason":"no complete successful main benchmark artifact found","regressions":[],"metrics":{}}\n' > build/android-performance/stress-regression-report.json
            exit 0
          fi

          echo "PERF_BASELINE run=$baseline_run root=$baseline_root"
          python3 tools/perf/compare_android_benchmark.py             "$baseline_root/performance-probe.json"             build/android-performance/performance-probe.json             --json-out build/android-performance/probe-regression-report.json
          python3 tools/perf/compare_android_benchmark.py             "$baseline_root/performance-stress.json"             build/android-performance/performance-stress.json             --json-out build/android-performance/stress-regression-report.json

      - name: Upload Android performance regression report
        uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'pull_request'
        with:
          name: android-performance-regression-${{ github.run_number }}
          path: |
            build/android-performance/probe-regression-report.json
            build/android-performance/stress-regression-report.json
          if-no-files-found: warn
          retention-days: 30
