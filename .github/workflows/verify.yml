name: Verify
on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Validate final sprite production layout
        run: |
          python3 -m py_compile tools/validate_final_sprite_layout.py tools/validate_rex_reference.py tools/slice_sprite_sheet.py tools/build_final_sprite_frames.py tools/verify_final_atlas.py tools/test_verify_final_atlas.py
          python3 tools/validate_final_sprite_layout.py
          python3 tools/validate_rex_reference.py
          python3 -m unittest discover -s tools -p 'test_verify_final_atlas.py'
      - name: Compile and test core
        run: gradle :core:compileJava :core:test :desktop:compileJava
      - name: Smoke-test desktop runtime
        run: xvfb-run -a gradle :desktop:smokeRun

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Verify Android production build
        run: gradle :android:lintDebug :android:lintRelease :android:assembleDebug :android:bundleRelease -PallowTestAds=true -PallowPlaceholderAssets=true

  android-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke-test Android runtime on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            gradle :android:connectedDebugAndroidTest
            gradle :android:installDebug
            adb shell pm path com.deadlinezero.game | grep -q 'package:'
            adb shell am force-stop com.deadlinezero.game
            test -z "$(adb shell pidof com.deadlinezero.game)"
            adb shell monkey -p com.deadlinezero.game -c android.intent.category.LAUNCHER 1
            sleep 2
            adb shell pidof com.deadlinezero.game | grep -q .
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | grep -q 'com.deadlinezero.game.android.AndroidLauncher'
