name: Shambler Source Scout
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/shambler-source-scout.yml'

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover official CC0 source pack
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urljoin
          from urllib.request import Request, urlopen
          import re

          PAGE = 'https://quaternius.com/packs/zombieapocalypsekit.html'
          req = Request(PAGE, headers={'User-Agent':'deadline-zero-art-source-scout/1.1'})
          html = urlopen(req, timeout=30).read().decode('utf-8', 'replace')
          Path('build').mkdir(exist_ok=True)
          Path('build/quaternius-zombie-apocalypse.html').write_text(html, encoding='utf-8')

          class Attrs(HTMLParser):
              def __init__(self):
                  super().__init__(); self.values=[]
              def handle_starttag(self, tag, attrs):
                  for key, value in attrs:
                      if value:
                          self.values.append((tag.lower(), key.lower(), value))

          parser = Attrs(); parser.feed(html)
          raw=[]
          for tag, key, value in parser.values:
              low=value.lower()
              if key in ('href','src','data-href','data-url','data-download','onclick') or 'download' in key:
                  raw.append(value)
              if any(token in low for token in ('.zip','.glb','.gltf','.fbx','.blend','zombieapocalypse','download')):
                  raw.append(value)

          # Also inspect quoted strings in inline JavaScript; official download buttons often route through JS.
          raw += re.findall(r"['\"]([^'\"]+(?:\.zip|\.glb|\.gltf|\.fbx|\.blend)[^'\"]*)['\"]", html, flags=re.I)
          raw += re.findall(r"['\"]([^'\"]*zombieapocalypse[^'\"]*)['\"]", html, flags=re.I)

          candidates=[]
          evidence=[]
          for value in raw:
              evidence.append(value)
              # Pull URLs/paths out of onclick snippets as well as ordinary attributes.
              parts=re.findall(r'https?://[^\"\'<> )]+|(?:\.\.?/|/)?[^\"\'() ]+\.(?:zip|glb|gltf|fbx|blend)(?:\?[^\"\'() ]*)?', value, flags=re.I)
              if not parts and value.startswith(('http://','https://','/','./','../')):
                  parts=[value]
              for part in parts:
                  url=urljoin(PAGE, part)
                  if url not in candidates: candidates.append(url)

          Path('build/source-candidates.txt').write_text('\n'.join(candidates) + '\n', encoding='utf-8')
          Path('build/download-hook-evidence.txt').write_text('\n'.join(dict.fromkeys(evidence)) + '\n', encoding='utf-8')
          urls=sorted(set(re.findall(r'https?://[^\"\'<> ]+', html)))
          Path('build/page-urls.txt').write_text('\n'.join(urls) + '\n', encoding='utf-8')
          print('Source page:', PAGE)
          print('Candidates:')
          print('\n'.join(candidates) if candidates else '(none)')
          PY
      - name: Probe candidate archives and inventory models
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          import hashlib, zipfile, io, json

          candidates = [x.strip() for x in Path('build/source-candidates.txt').read_text().splitlines() if x.strip()]
          report = {'source_page':'https://quaternius.com/packs/zombieapocalypsekit.html','license':'CC0','candidates':[], 'selected':None}
          for url in candidates:
              item={'url':url}
              try:
                  req=Request(url, headers={'User-Agent':'deadline-zero-art-source-scout/1.1'})
                  data=urlopen(req, timeout=90).read()
                  item['bytes']=len(data); item['sha256']=hashlib.sha256(data).hexdigest()
                  if zipfile.is_zipfile(io.BytesIO(data)):
                      z=zipfile.ZipFile(io.BytesIO(data))
                      names=z.namelist()
                      item['zip']=True
                      item['entries']=len(names)
                      matches=[n for n in names if any(k in n.lower() for k in ('zombie','enemy')) and n.lower().endswith(('.gltf','.glb','.fbx','.blend'))]
                      item['model_matches']=matches[:300]
                      if matches and report['selected'] is None:
                          report['selected']={k:v for k,v in item.items() if k != 'model_matches'}
                          report['selected']['model_matches']=matches[:300]
                          Path('build/selected-models.txt').write_text('\n'.join(matches)+'\n', encoding='utf-8')
                  else:
                      item['zip']=False
              except Exception as exc:
                  item['error']=repr(exc)
              report['candidates'].append(item)
          Path('build/shambler-source-scout.json').write_text(json.dumps(report, indent=2), encoding='utf-8')
          print(json.dumps(report, indent=2))
          PY
      - name: Upload source audit
        uses: actions/upload-artifact@v4
        with:
          name: shambler-source-scout-${{ github.run_number }}
          path: |
            build/shambler-source-scout.json
            build/source-candidates.txt
            build/download-hook-evidence.txt
            build/page-urls.txt
            build/selected-models.txt
            build/quaternius-zombie-apocalypse.html
          if-no-files-found: warn
          retention-days: 14
