name: Shambler Source Scout
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/shambler-source-scout.yml'

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover official CC0 source pack
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.request import Request, urlopen
          import re

          PAGE = 'https://quaternius.com/packs/zombieapocalypsekit.html'
          req = Request(PAGE, headers={'User-Agent':'deadline-zero-art-source-scout/1.2'})
          html = urlopen(req, timeout=30).read().decode('utf-8', 'replace')
          Path('build').mkdir(exist_ok=True)
          Path('build/quaternius-zombie-apocalypse.html').write_text(html, encoding='utf-8')

          drive = re.findall(r"https://drive\.google\.com/drive/folders/[A-Za-z0-9_-]+[^'\" )<]*", html)
          drive = list(dict.fromkeys(drive))
          Path('build/official-drive-folders.txt').write_text('\n'.join(drive)+'\n', encoding='utf-8')
          if not drive:
              raise SystemExit('Official Quaternius page did not expose its Google Drive folder')
          print('Official source folder:', drive[0])
          PY
      - name: Download official public source folder
        run: |
          python3 -m pip install --disable-pip-version-check 'gdown>=5.2,<6'
          mkdir -p build/quaternius-source
          DRIVE_URL="$(head -n1 build/official-drive-folders.txt)"
          gdown --folder "$DRIVE_URL" -O build/quaternius-source --remaining-ok
      - name: Inventory candidate enemy masters
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json

          root=Path('build/quaternius-source')
          files=[p for p in root.rglob('*') if p.is_file()]
          models=[p for p in files if p.suffix.lower() in {'.glb','.gltf','.fbx','.blend'}]
          enemy=[p for p in models if any(k in p.as_posix().lower() for k in ('zombie','enemy','infected'))]
          def row(p):
              data=p.read_bytes()
              return {
                  'path':p.relative_to(root).as_posix(),
                  'bytes':len(data),
                  'sha256':hashlib.sha256(data).hexdigest(),
                  'format':p.suffix.lower().lstrip('.'),
              }
          report={
              'source_page':'https://quaternius.com/packs/zombieapocalypsekit.html',
              'source_folder':Path('build/official-drive-folders.txt').read_text().strip(),
              'license':'CC0 1.0',
              'downloaded_files':len(files),
              'model_files':len(models),
              'enemy_candidates':[row(p) for p in enemy],
              'all_models':[row(p) for p in models],
          }
          Path('build/shambler-source-scout.json').write_text(json.dumps(report, indent=2), encoding='utf-8')
          Path('build/selected-models.txt').write_text('\n'.join(x['path'] for x in report['enemy_candidates'])+'\n', encoding='utf-8')
          print(json.dumps(report, indent=2))
          if not models:
              raise SystemExit('Official folder downloaded, but no supported 3D model files were found')
          PY
      - name: Upload source audit
        uses: actions/upload-artifact@v4
        with:
          name: shambler-source-scout-${{ github.run_number }}
          path: |
            build/shambler-source-scout.json
            build/official-drive-folders.txt
            build/selected-models.txt
          if-no-files-found: error
          retention-days: 14
