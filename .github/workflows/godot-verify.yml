name: Godot 3D Verify

on:
  pull_request:
    paths:
      - "godot/**"
      - "tools/audio/**"
      - "tools/assets/**"
      - "tools/blender/**"
      - ".github/workflows/godot-verify.yml"
  push:
    branches: [main]
    paths:
      - "godot/**"
      - ".github/workflows/godot-verify.yml"

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Generate original authored audio
        run: python3 tools/audio/generate_deadline_zero_audio.py

      - name: Validate premium asset stack
        run: python3 tools/assets/validate_asset_stack.py

      - name: Download Godot 4.7.2
        run: |
          set -euo pipefail
          curl -fL --retry 4 https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64

      - name: Import and parse Godot project
        run: |
          set -euo pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --editor --quit

      - name: Validate authored 3D imports
        run: timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/authored_asset_validation.gd
      - name: Validate combat-feel profile
        run: timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/combat_feel_test.gd
      - name: Validate mobile-safe impact FX
        run: timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/impact_fx_mobile_test.gd
      - name: Validate layered 3D Arc chain links and mobile geometry budget
        run: timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/arc_chain_link_fx_test.gd
      - name: Validate Inferno world-space radial blast and splash damage
        run: timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/inferno_blast_wave_test.gd
      - name: Validate world-space Cryo slow feedback and low-poly ice budget
        run: timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/cryo_status_fx_test.gd
      - name: Validate authored combat ground mark budget
        run: timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/combat_ground_mark_test.gd
      - name: Validate enemy archetype combat
        run: timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/enemy_archetype_combat_test.gd
      - name: Validate enemy hit reaction hierarchy
        run: timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/enemy_hit_reaction_test.gd
      - name: Validate repeated-hit 3D silhouette stability
        run: timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/multihit_silhouette_stability_test.gd
      - name: Validate damage-number clutter budget
        run: timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/damage_number_budget_test.gd
      - name: Validate run director escalation
        run: timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/run_director_escalation_test.gd
      - name: Validate enemy silhouette identities
        run: timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/enemy_silhouette_identity_test.gd
      - name: Validate soft radial contact shadow budget
        run: timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/soft_contact_shadow_budget_test.gd
      - name: Validate authored character gait synchronization
        run: timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/authored_gait_sync_test.gd
      - name: Validate final shock frame and authored animation recovery
        run: timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/shock_expiry_recovery_test.gd
      - name: Validate mobile swarm shadow-caster budget
        run: timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/enemy_shadow_budget_test.gd
      - name: Validate weapon presentation identities
        run: timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/weapon_presentation_test.gd
      - name: Validate authored directional 3D muzzle flare
        run: timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/muzzle_flare_3d_test.gd
      - name: Validate real rifle muzzle projectile alignment
        run: timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/rifle_muzzle_ballistics_test.gd
      - name: Validate player pressure marker lifecycle
        run: timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/player_pressure_marker_test.gd
      - name: Validate player targeting stability
        run: timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/player_targeting_stability_test.gd
      - name: Validate restrained 3D world-space autoaim reticle
        run: timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/world_target_lock_test.gd
      - name: Validate Android Play export contract
        run: timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/android_play_export_contract_test.gd
      - name: Validate Godot Play Store claims
        run: timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/play_store_claims_test.gd
      - name: Validate weapon profile data
        run: timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/weapon_profile_data_test.gd
      - name: Validate projectile profile runtime visuals
        run: timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/projectile_profile_runtime_visual_test.gd
      - name: Validate upgrade presentation identities
        run: timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/upgrade_presentation_test.gd
      - name: Validate boss reveal camera
        run: timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/boss_reveal_camera_test.gd
      - name: Validate boss HUD identity
        run: timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/boss_hud_identity_test.gd
      - name: Validate boss phase runtime
        run: timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/boss_phase_runtime_test.gd
      - name: Validate combat audio feedback
        run: timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/combat_audio_feedback_test.gd
      - name: Validate authored combat audio assets
        run: timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/authored_audio_asset_test.gd
      - name: Validate run-end UX
        run: timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/run_end_ux_test.gd
      - name: Validate consolidated combat danger HUD
        run: timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/combat_danger_hud_test.gd
      - name: Validate combat HUD readability hierarchy
        run: timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/hud_readability_hierarchy_test.gd
      - name: Validate offscreen boss and elite priority
        run: timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/offscreen_threat_priority_test.gd
      - name: Validate attack telegraph escalation
        run: timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/attack_telegraph_escalation_test.gd
      - name: Validate enemy attack windup facing lock
        run: timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/attack_facing_lock_test.gd
      - name: Validate player damage feedback
        run: timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/player_damage_feedback_test.gd
      - name: Validate screen-space impact FX
        run: timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/screen_space_fx_test.gd
      - name: Validate environment identity
        run: timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/environment_identity_test.gd
      - name: Validate real CC0 asphalt terrain PBR textures
        run: timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/authored_asphalt_pbr_floor_test.gd
      - name: Validate authored environment assets
        run: timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/environment_asset_validation_test.gd
      - name: Validate authored prop textures and industrial PBR
        run: timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/industrial_prop_material_test.gd
      - name: Validate shared authored industrial PBR materials
        run: timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/industrial_material_sharing_test.gd
      - name: Validate authored industrial GLB surface grading and mobile draw budget
        run: timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/industrial_kit_pbr_budget_test.gd
      - name: Validate authored world dressing
        run: timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/authored_world_dressing_test.gd
      - name: Validate mobile landscape contract
        run: timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/mobile_orientation_test.gd
      - name: Validate native upgrade depth
        run: timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/native_upgrade_depth_test.gd
      - name: Validate XP orb runtime
        run: timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/xp_orb_runtime_test.gd
      - name: Validate weapon protocol behavior
        run: timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/weapon_protocol_behavior_test.gd
      - name: Validate enemy spatial hash
        run: timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/spatial_hash_test.gd
      - name: Validate native enemy behaviors
        run: timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/native_enemy_behavior_test.gd
      - name: Validate status effects
        run: timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/status_effects_test.gd
      - name: Validate enemy projectile visual
        run: timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/enemy_projectile_visual_test.gd
      - name: Validate haptics service
        run: timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/haptics_service_test.gd
      - name: Validate settings persistence
        run: timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/settings_persistence_test.gd
      - name: Validate Godot pause/settings mobile layout
        run: timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/pause_settings_layout_test.gd
      - name: Validate run-end combat freeze
        run: timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/run_end_combat_freeze_test.gd
      - name: Validate first-playable run path
        run: timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/first_playable_run_path_test.gd
      - name: Run Godot smoke test
        run: timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/smoke_test.gd

      - name: Install rendered-frame smoke dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri

      - name: Render and validate real first-playable frame
        run: |
          set -euo pipefail
          rm -f /tmp/deadline-zero-rendered-frame.png
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a \
            /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 \
            --path godot \
            --rendering-method gl_compatibility \
            --audio-driver Dummy \
            --script res://tests/rendered_frame_smoke_test.gd
          test -s /tmp/deadline-zero-rendered-frame.png
          mkdir -p build/godot-visual-smoke
          cp /tmp/deadline-zero-rendered-frame.png build/godot-visual-smoke/first-playable-rendered.png

      - name: Render enemy archetype roster evidence
        run: |
          set -euo pipefail
          rm -f /tmp/deadline-zero-archetype-roster.png
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a \
            /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 \
            --path godot \
            --rendering-method gl_compatibility \
            --audio-driver Dummy \
            --script res://tests/archetype_roster_render_test.gd
          test -s /tmp/deadline-zero-archetype-roster.png
          cp /tmp/deadline-zero-archetype-roster.png build/godot-visual-smoke/archetype-roster-rendered.png

      - name: Render Arc and Inferno 3D VFX evidence
        run: |
          set -euo pipefail
          rm -f /tmp/deadline-zero-elemental-protocols.png
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a \
            /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 \
            --path godot \
            --rendering-method gl_compatibility \
            --audio-driver Dummy \
            --script res://tests/elemental_protocols_render_test.gd
          test -s /tmp/deadline-zero-elemental-protocols.png
          cp /tmp/deadline-zero-elemental-protocols.png build/godot-visual-smoke/elemental-protocols-rendered.png
          test -s /tmp/deadline-zero-inferno-residue.png
          cp /tmp/deadline-zero-inferno-residue.png build/godot-visual-smoke/inferno-scorch-residue-rendered.png

      - name: Render mid-run pressure evidence
        run: |
          set -euo pipefail
          rm -f /tmp/deadline-zero-pressure-frame.png
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a \
            /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 \
            --path godot \
            --rendering-method gl_compatibility \
            --audio-driver Dummy \
            --script res://tests/pressure_frame_render_test.gd
          test -s /tmp/deadline-zero-pressure-frame.png
          cp /tmp/deadline-zero-pressure-frame.png build/godot-visual-smoke/midrun-pressure-rendered.png

      - name: Render run-end presentation evidence
        run: |
          set -euo pipefail
          rm -f /tmp/deadline-zero-game-over-frame.png
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a \
            /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 \
            --path godot \
            --rendering-method gl_compatibility \
            --audio-driver Dummy \
            --script res://tests/game_over_render_test.gd
          test -s /tmp/deadline-zero-game-over-frame.png
          cp /tmp/deadline-zero-game-over-frame.png build/godot-visual-smoke/run-end-rendered.png

      - name: Upload rendered Godot visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: godot-rendered-visual-qa-${{ github.sha }}
          path: build/godot-visual-smoke/*.png
          if-no-files-found: error
          retention-days: 14
