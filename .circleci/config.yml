version: 2.1

jobs:
  android-runtime-acceptance:
    machine:
      image: android:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Pin Java 21 and Gradle 8.11.1
          command: |
            set -euo pipefail
            sudo apt-get update -qq
            sudo apt-get install -y openjdk-21-jdk-headless unzip
            export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
            echo 'export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64' >> "$BASH_ENV"
            curl -fsSL https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp
            echo 'export PATH=/tmp/gradle-8.11.1/bin:$PATH' >> "$BASH_ENV"
            source "$BASH_ENV"
            java -version
            gradle --version
      - run:
          name: Validate staged production actors
          command: |
            set -euo pipefail
            source "$BASH_ENV"
            python3 tools/validate_final_sprite_layout.py
            python3 tools/sprites/validate_actor_production_contracts.py
            test -s assets/art/shielded.png
            test -s assets/art/shielded-manifest.json
      - run:
          name: Prepare Android 35 emulator
          command: |
            set -euo pipefail
            source "$BASH_ENV"
            yes | sdkmanager --licenses >/dev/null || true
            sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools' 'emulator' 'system-images;android-35;google_apis;x86_64'
            echo no | avdmanager create avd --force --name dz_api35 --package 'system-images;android-35;google_apis;x86_64' --device 'pixel_2'
            nohup emulator -avd dz_api35 -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none > /tmp/dz-emulator.log 2>&1 &
            adb wait-for-device
            for i in $(seq 1 120); do
              if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then break; fi
              sleep 2
            done
            test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            adb devices
      - run:
          name: Capture SHIELDED crowded Android acceptance
          command: |
            set -euo pipefail
            source "$BASH_ENV"
            gradle :android:connectedDebugAndroidTest
            gradle :android:installDebug :android:installDebugAndroidTest
            adb shell pm path com.deadlinezero.game | grep -q 'package:'
            adb shell cmd package resolve-activity --brief -a android.intent.action.MAIN -c android.intent.category.LAUNCHER com.deadlinezero.game | grep -q 'AndroidLauncher'
            adb shell settings put secure immersive_mode_confirmations confirmed || true
            adb shell am instrument -w -e class com.deadlinezero.game.android.AndroidGameplayVisualProbeTest#capturesRexGameplayAndAttackFrames com.deadlinezero.game.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/dz-visual-probe.txt
            grep -q 'OK (1 test)' /tmp/dz-visual-probe.txt
            mkdir -p build/android-visual-qa
            for image in rex-gameplay.png rex-shambler-crowd.png rex-attack.png; do
              adb shell ls -l "/sdcard/Android/data/com.deadlinezero.game/files/qa/$image"
              adb pull "/sdcard/Android/data/com.deadlinezero.game/files/qa/$image" "build/android-visual-qa/$image"
              test -s "build/android-visual-qa/$image"
            done
            cp /tmp/dz-visual-probe.txt build/android-visual-qa/instrumentation.txt
            cp /tmp/dz-emulator.log build/android-visual-qa/emulator.log
      - store_artifacts:
          path: build/android-visual-qa
          destination: android-visual-qa

workflows:
  circleci-fallback:
    jobs:
      - android-runtime-acceptance
