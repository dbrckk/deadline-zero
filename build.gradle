import groovy.json.JsonSlurper
import javax.imageio.ImageIO

plugins {
    id 'com.android.application' version '8.10.1' apply false
}

allprojects {
    group = 'com.deadlinezero'
    version = providers.gradleProperty('appVersion').get()
}

configurations {
    texturePacker
}

dependencies {
    texturePacker "com.badlogicgames.gdx:gdx-tools:${providers.gradleProperty('gdxVersion').get()}"
}

def finalArtLayoutFile = file('art_sources/final-sprite-layout.json')
def finalFramesDir = file('build/art_frames')
def finalFramesManifest = file('build/art_frames/final-sprite-build.json')
def finalArtOutputDir = file('assets/art')
def finalAtlasFile = file('assets/art/game.atlas')
def finalPackerSettings = file('tools/texturepacker-final.json')

def expectedFinalFrameCount = { layout ->
    long total = 0L
    layout.actors.each { actor ->
        Map counts = new LinkedHashMap(actor.profile == 'boss' ? layout.bossFrames : layout.standardFrames)
        if (actor.containsKey('runFrames')) counts.run = actor.runFrames
        long perDirection = 0L
        layout.motionOrder.each { motion -> perDirection += (counts[motion] as Number).longValue() }
        total += perDirection * layout.directions.size()
    }
    total
}

tasks.register('packFinalAtlas', JavaExec) {
    group = 'art production'
    description = 'Packs a complete strict final-sprite frame build into assets/art/game.atlas using libGDX TexturePacker.'
    classpath = configurations.texturePacker
    mainClass = 'com.badlogic.gdx.tools.texturepacker.TexturePacker'

    doFirst {
        if (!finalArtLayoutFile.isFile()) throw new GradleException('Missing final art layout: art_sources/final-sprite-layout.json')
        if (!finalFramesManifest.isFile()) {
            throw new GradleException('Missing build/art_frames/final-sprite-build.json. Run tools/build_final_sprite_frames.py --clean --require-all --strict first.')
        }
        if (!finalPackerSettings.isFile()) throw new GradleException('Missing TexturePacker settings: tools/texturepacker-final.json')

        def layout = new JsonSlurper().parse(finalArtLayoutFile)
        def manifest = new JsonSlurper().parse(finalFramesManifest)
        Set<String> requiredActors = new LinkedHashSet<String>(layout.actors.collect { it.id as String })
        Set<String> builtActors = new LinkedHashSet<String>((manifest.builtActors ?: []).collect { it.id as String })
        List missingActors = manifest.missingActors ?: []
        int qaWarnings = (manifest.qaWarnings ?: 0) as int
        long requiredFrames = expectedFinalFrameCount(layout)
        long builtFrames = (manifest.totalFrames ?: 0) as long

        if (!missingActors.isEmpty() || builtActors != requiredActors) {
            Set<String> absent = new LinkedHashSet<String>(requiredActors)
            absent.removeAll(builtActors)
            throw new GradleException('Final atlas packing blocked: incomplete actor frame build. Missing: ' + absent.join(', '))
        }
        if (qaWarnings != 0) {
            throw new GradleException("Final atlas packing blocked: strict frame QA has ${qaWarnings} warning(s).")
        }
        if (builtFrames != requiredFrames) {
            throw new GradleException("Final atlas packing blocked: frame manifest has ${builtFrames} frames; contract requires ${requiredFrames}.")
        }

        finalArtOutputDir.mkdirs()
        if (finalAtlasFile.exists() && !finalAtlasFile.delete()) {
            throw new GradleException('Unable to replace existing assets/art/game.atlas')
        }
        finalArtOutputDir.listFiles()?.findAll {
            it.isFile() && it.name ==~ /game\d*\.png/
        }?.each { File page ->
            if (!page.delete()) throw new GradleException("Unable to replace old atlas page: ${page}")
        }

        args = [
            finalFramesDir.absolutePath,
            finalArtOutputDir.absolutePath,
            'game',
            finalPackerSettings.absolutePath
        ]
        logger.lifecycle("Packing ${builtFrames} final actor frames with libGDX ${providers.gradleProperty('gdxVersion').get()}...")
    }
}

tasks.register('verifyFinalAtlasCoverage') {
    group = 'verification'
    description = 'Fails unless assets/art/game.atlas contains every contracted final directional actor frame and valid page image.'
    doLast {
        File layoutFile = finalArtLayoutFile
        File atlasFile = finalAtlasFile
        if (!layoutFile.isFile()) throw new GradleException('Final art layout missing: art_sources/final-sprite-layout.json')
        if (!atlasFile.isFile()) throw new GradleException('Final production atlas missing: assets/art/game.atlas')

        def layout = new JsonSlurper().parse(layoutFile)
        Map<String, Set<Integer>> actual = [:]
        Set<String> pageImages = new LinkedHashSet<String>()
        String current = null
        int currentIndex = -1
        def commitRegion = {
            if (current != null) {
                if (!actual.containsKey(current)) actual[current] = new LinkedHashSet<Integer>()
                actual[current].add(currentIndex)
            }
            current = null
            currentIndex = -1
        }

        atlasFile.eachLine('UTF-8') { String raw ->
            String line = raw.trim()
            if (line.isEmpty()) {
                commitRegion()
            } else if (!line.contains(':')) {
                String lower = line.toLowerCase(Locale.ROOT)
                if (lower.endsWith('.png') || lower.endsWith('.jpg') || lower.endsWith('.jpeg') || lower.endsWith('.webp')) {
                    commitRegion()
                    pageImages.add(line.replace('\\', '/'))
                } else {
                    commitRegion()
                    current = line.replace('\\', '/').replaceAll('^/+|/+$', '')
                }
            } else if (current != null) {
                int split = line.indexOf(':')
                String key = line.substring(0, split).trim()
                if (key == 'index') {
                    try {
                        currentIndex = Integer.parseInt(line.substring(split + 1).trim())
                    } catch (NumberFormatException exception) {
                        throw new GradleException("Invalid atlas index for ${current}: ${line}", exception)
                    }
                }
            }
        }
        commitRegion()

        if (pageImages.isEmpty()) throw new GradleException('Final production atlas contains no texture pages.')
        File canonicalPageRoot = atlasFile.parentFile.canonicalFile
        int maxPageWidth = (layout.packing.maxPage[0] as Number).intValue()
        int maxPageHeight = (layout.packing.maxPage[1] as Number).intValue()
        pageImages.each { String pageName ->
            if (!pageName.toLowerCase(Locale.ROOT).endsWith('.png')) {
                throw new GradleException("Final atlas page must use PNG output: ${pageName}")
            }
            File pageFile = new File(atlasFile.parentFile, pageName).canonicalFile
            String allowedPrefix = canonicalPageRoot.path + File.separator
            if (!pageFile.path.startsWith(allowedPrefix)) {
                throw new GradleException("Final atlas page escapes assets/art: ${pageName}")
            }
            if (!pageFile.isFile()) throw new GradleException("Final atlas page missing: ${pageFile}")
            def image = ImageIO.read(pageFile)
            if (image == null) throw new GradleException("Final atlas page is not a readable PNG: ${pageFile}")
            if (image.width <= 0 || image.height <= 0 || image.width > maxPageWidth || image.height > maxPageHeight) {
                throw new GradleException("Final atlas page dimensions invalid: ${pageFile.name} is ${image.width}x${image.height}; max is ${maxPageWidth}x${maxPageHeight}")
            }
        }

        List<String> missingAnimations = []
        List<String> frameMismatches = []
        long expectedFrameCount = 0L
        layout.actors.each { actor ->
            Map counts = new LinkedHashMap(actor.profile == 'boss' ? layout.bossFrames : layout.standardFrames)
            if (actor.containsKey('runFrames')) counts.run = actor.runFrames
            layout.directions.each { direction ->
                layout.motionOrder.each { motion ->
                    String key = "${actor.root}/${direction}/${motion}"
                    int count = (counts[motion] as Number).intValue()
                    expectedFrameCount += count
                    Set<Integer> expected = new LinkedHashSet<Integer>((0..<count).collect { it as Integer })
                    Set<Integer> found = actual[key]
                    if (found == null) {
                        missingAnimations.add(key)
                    } else if (found != expected) {
                        Set<Integer> missing = new LinkedHashSet<Integer>(expected)
                        missing.removeAll(found)
                        Set<Integer> extra = new LinkedHashSet<Integer>(found)
                        extra.removeAll(expected)
                        frameMismatches.add("${key}: missing=${missing}, extra=${extra}")
                    }
                }
            }
        }

        if (!missingAnimations.isEmpty() || !frameMismatches.isEmpty()) {
            StringBuilder message = new StringBuilder('Production release blocked: final atlas coverage is incomplete.')
            if (!missingAnimations.isEmpty()) {
                message.append(" Missing animations (${missingAnimations.size()}): ")
                    .append(missingAnimations.take(20).join(', '))
                if (missingAnimations.size() > 20) message.append(', ...')
            }
            if (!frameMismatches.isEmpty()) {
                message.append(" Frame mismatches (${frameMismatches.size()}): ")
                    .append(frameMismatches.take(20).join(' | '))
                if (frameMismatches.size() > 20) message.append(' | ...')
            }
            throw new GradleException(message.toString())
        }

        logger.lifecycle("Final atlas coverage OK: ${pageImages.size()} page(s), ${layout.actors.size() * layout.directions.size() * layout.motionOrder.size()} directional animations, ${expectedFrameCount} indexed frames")
    }
}

tasks.register('buildFinalAtlas') {
    group = 'art production'
    description = 'Packs the strict final frame build and verifies complete runtime animation coverage.'
    dependsOn 'packFinalAtlas'
    finalizedBy 'verifyFinalAtlasCoverage'
}

tasks.named('verifyFinalAtlasCoverage').configure {
    mustRunAfter 'packFinalAtlas'
}

gradle.projectsEvaluated {
    project(':android').tasks.named('verifyProductionAssets').configure {
        dependsOn rootProject.tasks.named('verifyFinalAtlasCoverage')
    }
}
